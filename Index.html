<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=<device-width>, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div class="calculator">

        <div class="screen">0</div><br><br>
        <div class="button-row">
            <button class="AC">AC</button>
            <button>00</button>
            <button>%</button>
            <button class="operation">÷</button>
        </div>

        <div class="row">
            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operation">X</button>
        </div>
        <div class="row">
            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operation">-</button>
        </div>
        <div class="row">
            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operation">+</button>
        </div>
        <div class="row">
            <button class="Number">0</button>
            <button>.</button>
            <button class="operation">=</button>
        </div>
    </div>
    <link rel="stylesheet" href="style.css">


</body>

</html>
